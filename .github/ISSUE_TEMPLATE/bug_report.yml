name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please remove hostnames, storage system names and credentials before submitting.
  - type: input
    id: version
    attributes:
      label: ppdm-capacity-planner version
      placeholder: e.g. 1.0.2 (shown at the top of the report)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Live PPDM, "--demo"]
    validations:
      required: true
  - type: input
    id: ppdm-version
    attributes:
      label: PPDM version
      placeholder: e.g. 19.15
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or output (redacted)
      render: text
